<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام اللعب أونلاين</title>
  <!-- مكتبة PeerJS للربط أونلاين -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #1e1e1e;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    input {
      width: 80%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #333;
      background-color: #2a2a2a;
      color: #fff;
      text-align: center;
      font-size: 16px;
    }
    button {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    button:hover {
      background-color: #2563eb;
    }
    .status {
      margin-top: 15px;
      font-size: 14px;
      color: #a1a1aa;
    }
    .chat-box {
      margin-top: 15px;
      height: 120px;
      overflow-y: auto;
      background: #18181b;
      border-radius: 8px;
      padding: 8px;
      text-align: right;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>اللعب أونلاين (نظام الغرف)</h2>
  
  <div>
    <p>معرف الغرفة الخاص بك:</p>
    <b id="my-id" style="color: #60a5fa;">جاري الاتصال...</b>
  </div>

  <hr style="border-color: #333; margin: 20px 0;">

  <div>
    <input type="text" id="room-input" placeholder="أدخل رمز غرفة الصديق">
    <button onclick="joinRoom()">انضمام للغرفة</button>
  </div>

  <div class="status" id="status-text">حالة الاتصال: غير متصل</div>

  <div class="chat-box" id="chat-box"></div>

  <div style="margin-top: 10px;">
    <input type="text" id="msg-input" placeholder="اكتب رسالة...">
    <button onclick="sendData()">إرسال</button>
  </div>
</div>

<script>
  let peer = null;
  let conn = null;

  // إنشاء اتصال جديد مع السيرفر وتوليد ID تلقائي للغرفة
  function initPeer() {
    peer = new Peer();

    peer.on('open', (id) => {
      document.getElementById('my-id').innerText = id;
      document.getElementById('status-text').innerText = "حالة الاتصال: جاهز للإنشاء أو الانضمام";
    });

    // الاستماع عند انضمام شخص آخر لغرفتك
    peer.on('connection', (connection) => {
      conn = connection;
      setupConnection();
      document.getElementById('status-text').innerText = "حالة الاتصال: تم اتصال الخصم بنجاح!";
    });
  }

  // الانضمام لغرفة عبر الكود
  function joinRoom() {
    const roomId = document.getElementById('room-input').value.trim();
    if (!roomId) return alert("يرجى إدخال رمز الغرفة أولاً");

    document.getElementById('status-text').innerText = "جاري الاتصال بالغرفة...";
    conn = peer.connect(roomId);

    conn.on('open', () => {
      document.getElementById('status-text').innerText = "حالة الاتصال: متصل بالغرفة!";
      setupConnection();
    });
  }

  // إعداد إرسال واستقبال البيانات بين الأجهزة
  function setupConnection() {
    conn.on('data', (data) => {
      appendMessage("الخصم: " + data);
      
      // لمعرفة هل تم استقبال البيانات بنجاح في الواجهة
      // يمكنك استخدام متغير 'data' وتمريره لنظام اللعبة الخاص بك
    });

    conn.on('close', () => {
      document.getElementById('status-text').innerText = "حالة الاتصال: قطع الاتصال";
    });
  }

  // إرسال البيانات للطرف الآخر
  function sendData() {
    const input = document.getElementById('msg-input');
    const data = input.value.trim();
    
    if (conn && conn.open && data !== "") {
      conn.send(data);
      appendMessage("أنت: " + data);
      input.value = "";
    } else {
      alert("لست متصلاً بأي غرفة حالياً!");
    }
  }

  function appendMessage(msg) {
    const chatBox = document.getElementById('chat-box');
    const p = document.createElement('p');
    p.style.margin = "4px 0";
    p.innerText = msg;
    chatBox.appendChild(p);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  // بدء التشغيل
  initPeer();
</script>

</body>
</html>
