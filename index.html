<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة XO - فرصة واحدة فقط</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شاشة الحظر عند الخسارة -->
    <div id="banned-screen" class="hidden">
        <div class="banned-card">
            <h1>❌ تم حظرك!</h1>
            <p>لقد خسرت اللعبة، ولا يمكنك الدخول إلى هذا الموقع مرة أخرى.</p>
        </div>
    </div>

    <!-- شاشة اللعبة الرئيسية -->
    <div id="game-screen" class="container">
        <h1>لعبة XO (اختر بحذر!)</h1>
        <p class="subtitle">إذا خسرت.. فلن تتمكن من الدخول للموقع مجدداً!</p>
        
        <div id="status">دورك الآن (X)</div>

        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
