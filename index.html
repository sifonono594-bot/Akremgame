<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة XO - أونلاين</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #1e1e1e;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    input {
      width: 80%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #333;
      background-color: #2a2a2a;
      color: #fff;
      text-align: center;
      font-size: 16px;
    }
    button {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background-color: #2563eb; }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 20px 0;
    }
    .cell {
      width: 80px;
      height: 80px;
      background-color: #2a2a2a;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
    }
    .banned-screen {
      display: none;
      color: #ef4444;
    }
  </style>
</head>
<body>

<div class="card" id="main-card">
  <h2>لعبة XO أونلاين</h2>

  <!-- شاشة الحظر -->
  <div id="banned-section" class="banned-screen">
    <h3>🚫 أنت مبند إلى الأبد!</h3>
    <p>لقد خسرت في اللعبة وتم حظرك.</p>
    <input type="text" id="unban-code" placeholder="أدخل كود الإحياء">
    <button onclick="checkUnbanCode()">فك الحظر</button>
  </div>

  <!-- محتوى اللعبة الرئيسي -->
  <div id="game-section">
    <div>
      <p>رمز غرفتك (5 أرقام):</p>
      <b id="my-id" style="color: #60a5fa; font-size: 20px;">جاري التوليد...</b>
    </div>

    <hr style="border-color: #333; margin: 15px 0;">

    <div>
      <input type="text" id="room-input" maxlength="5" placeholder="رمز غرفة الخصم (5 أرقام)">
      <button onclick="joinRoom()">انضمام</button>
    </div>

    <div id="status-text" style="margin-top:10px; font-size:14px; color:#a1a1aa;">الحالة: غير متصل</div>

    <div class="board" id="board">
      <div class="cell" onclick="makeMove(0)"></div>
      <div class="cell" onclick="makeMove(1)"></div>
      <div class="cell" onclick="makeMove(2)"></div>
      <div class="cell" onclick="makeMove(3)"></div>
      <div class="cell" onclick="makeMove(4)"></div>
      <div class="cell" onclick="makeMove(5)"></div>
      <div class="cell" onclick="makeMove(6)"></div>
      <div class="cell" onclick="makeMove(7)"></div>
      <div class="cell" onclick="makeMove(8)"></div>
    </div>
  </div>
</div>

<script>
  const SECRET_UNBAN_CODE = "REVIVE2026"; // كود الإحياء
  let peer = null;
  let conn = null;
  let mySymbol = "";
  let currentTurn = "X";
  let boardState = ["", "", "", "", "", "", "", "", ""];
  let gameActive = false;

  // التحقق من الحظر عند فتح الصفحة
  if (localStorage.getItem("isBanned") === "true") {
    showBanScreen();
  } else {
    initPeer();
  }

  function generate5DigitId() {
    return Math.floor(10000 + Math.random() * 90000).toString();
  }

  function initPeer() {
    const customId = generate5DigitId();
    
    // إعداد الاتصال مع سيرفرات STUN لحل مشكلة عدم الاتصال بين الجوالات
    peer = new Peer(customId, {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    });

    peer.on('open', (id) => {
      document.getElementById('my-id').innerText = id;
      document.getElementById('status-text').innerText = "جاهز، أنت اللاعب (X)";
      mySymbol = "X";
    });

    peer.on('connection', (connection) => {
      conn = connection;
      setupConnection();
      document.getElementById('status-text').innerText = "متصل! دور اللاعب (X)";
      gameActive = true;
    });
  }

  function joinRoom() {
    const roomId = document.getElementById('room-input').value.trim();
    if (roomId.length !== 5) return alert("أدخل رمزاً مكوناً من 5 أرقام");

    document.getElementById('status-text').innerText = "جاري الاتصال...";
    conn = peer.connect(roomId, {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    });

    conn.on('open', () => {
      mySymbol = "O";
      document.getElementById('status-text').innerText = "متصل! أنت اللاعب (O)";
      gameActive = true;
      setupConnection();
    });
  }

  function setupConnection() {
    conn.on('data', (data) => {
      if (data.type === "MOVE") {
        updateBoard(data.index, data.symbol);
        currentTurn = mySymbol;
        checkGameResult();
      }
    });
  }

  function makeMove(index) {
    if (!gameActive || boardState[index] !== "" || currentTurn !== mySymbol) return;

    updateBoard(index, mySymbol);
    conn.send({ type: "MOVE", index: index, symbol: mySymbol });
    currentTurn = mySymbol === "X" ? "O" : "X";
    checkGameResult();
  }

  function updateBoard(index, symbol) {
    boardState[index] = symbol;
    document.getElementsByClassName('cell')[index].innerText = symbol;
  }

  function checkGameResult() {
    const wins = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    for (let combo of wins) {
      const [a, b, c] = combo;
      if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
        gameActive = false;
        if (boardState[a] === mySymbol) {
          alert("🎉 مبروك! لقد فزت!");
        } else {
          alert("💀 خسرت! تم حظرك من اللعبة للأبد.");
          applyBan();
        }
        return;
      }
    }

    if (!boardState.includes("")) {
      alert("تعادل!");
      gameActive = false;
    }
  }

  function applyBan() {
    localStorage.setItem("isBanned", "true");
    showBanScreen();
  }

  function showBanScreen() {
    document.getElementById('game-section').style.display = "none";
    document.getElementById('banned-section').style.display = "block";
  }

  function checkUnbanCode() {
    const input = document.getElementById('unban-code').value.trim();
    if (input === SECRET_UNBAN_CODE) {
      localStorage.removeItem("isBanned");
      alert("تم فك الحظر بنجاح! عدت للحياة.");
      location.reload();
    } else {
      alert("الكود خاطئ!");
    }
  }
</script>

</body>
</html>
